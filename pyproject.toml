[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-audit-kit"
version = "0.3.0"
description = "Traceable CSV POI audits and static thematic maps"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "3.1415926", email = "mqx74123@gmail.com"}]
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.8,<4", "shapely>=2,<3", "pyproj>=3.6,<4"]

[project.optional-dependencies]
gui = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
poi-audit = "poi_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
